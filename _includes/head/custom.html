{% include base_path %}
<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Custom Favicon -->
<link rel="shortcut icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=3"/>
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png?v=3"/>
<link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/favicon-192x192.png?v=3"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=3"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Custom CSS -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/custom.css">

<style>
/* Riduce font size di tutto il sito */
html {
  font-size: 14px !important;
}

body {
  font-size: 1em !important;
}

/* Mantieni proporzioni per titoli */
h1 { font-size: 1.8em !important; }
h2 { font-size: 1.5em !important; }
h3 { font-size: 1.3em !important; }
h4 { font-size: 1.1em !important; }

/* Regola il contenuto principale per TUTTI i layout */
@media (min-width: 64em) {
  .page {
    width: calc(100% - 320px) !important;
    padding-right: 20px !important;
    float: right !important;
  }
  
  .archive {
    width: calc(100% - 320px) !important;
    padding-right: 20px !important;
    float: right !important;
  }
}

/* Ingrandisci foto profilo */
.author__avatar img {
  max-width: 200px !important;
  width: 200px !important;
}
</style>

<!-- end custom head snippets -->
